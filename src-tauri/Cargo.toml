[package]
name = "dvoix"
description = "dvoix: notes, projects and tracking on plain files"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dvoix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dvoix-core = { path = "../crates/dvoix-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ureq = "3.5"

[dev-dependencies]
tempfile = "3"

# Settings of the Linux webview that Tauri doesn't expose (smooth scrolling).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

# `process.rs` ends a program by its process id while the reaper thread holds
# the child handle in a blocking wait (kill without polling).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
